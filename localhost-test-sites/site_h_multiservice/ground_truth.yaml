site_id: site_h_multiservice
org_name: Pacific Community Services
intake_url: http://localhost:9000/site_h_multiservice/intake
has_intake_form: true
form_type: multiservice_intake
requires_login: false
has_captcha: false
pdf_links: []

# NAVIGATION FIXTURE — the point of this site is the nested navigation
# (top nav + programs/ sub-nav) for the Research Crawler; the intake form
# itself is deliberately flat and linear. No feature test uses this site as
# primary; this ground truth exists for benchmark field recall and autopsies.
expected_abort: null

# date_of_birth is always sensitive → sensitive_field.
expected_red_flag_codes:
  - sensitive_field

expected_pages:
  - page_index: 0
    is_terminal_submit: true
    advance_is_server_roundtrip: false

fields:
  - name: first_name
    label: First Name
    field_type: text
    required: true
    is_sensitive: false
    expected_canonical_key: first_name

  - name: last_name
    label: Last Name
    field_type: text
    required: true
    is_sensitive: false
    expected_canonical_key: last_name

  - name: dob
    label: Date of Birth
    field_type: date
    required: true
    is_sensitive: true
    expected_canonical_key: date_of_birth

  - name: phone
    label: Phone Number
    field_type: tel
    required: false
    is_sensitive: false
    expected_canonical_key: phone

  - name: email
    label: Email Address
    field_type: email
    required: false
    is_sensitive: false
    expected_canonical_key: email

  - name: zip_code
    label: ZIP Code
    field_type: text
    required: true
    is_sensitive: false
    expected_canonical_key: zip_code

  - name: household_size
    label: Household Size
    field_type: number
    required: false
    is_sensitive: false
    expected_canonical_key: household_size

  # Four checkboxes share name="programs" (values housing/food/employment/health).
  # LLM VARIANCE: may be emitted as one grouped checkbox question or four separate
  # checkboxes — declared as one group here; do not hard-assert the grouping.
  - name: programs
    label: Which services are you interested in?
    field_type: checkbox
    required: false
    is_sensitive: false
    expected_canonical_key: services_requested
