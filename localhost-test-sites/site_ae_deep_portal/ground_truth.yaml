site_id: site_ae_deep_portal
org_name: Cedar Valley Community Portal
intake_url: http://localhost:9000/site_ae_deep_portal/intake
has_intake_form: true
form_type: emergency_aid
requires_login: false
has_captcha: false
pdf_links: []

# DEEP-NAV PORTAL WITH DECOY FORMS — the application page is reachable from
# the landing page only through a four-level navigation chain:
#   / → /programs → /programs/services → /programs/services/aid
#     → /programs/services/aid/apply → /intake
# The intake page itself contains FOUR <form> elements in document order:
#   1. #portal-search  — header site-search widget (role="search", action="/")
#   2. #newsletter     — newsletter signup (action="/subscribe")
#   3. #aid-form       — the application (action="#")
#   4. #footer-search  — footer search widget (role="search", action="/")
# The application uses fieldset/legend sections (Applicant, Household,
# Documents) with the agreement checkbox sitting OUTSIDE every fieldset, and
# an optional multi-file upload capped by data attributes (2 files, 5 MB).
expected_abort: null

expected_absent_field_names: [q, news_email]   # widget fields, not application fields

expected_red_flag_codes: []

expected_pages:
  - page_index: 0
    is_terminal_submit: true
    advance_is_server_roundtrip: false

expected_form_metadata:
  needs_consent: true
  has_file_upload: true

fields:
  - name: first_name
    label: First Name
    field_type: text
    required: true
    is_sensitive: false
    expected_canonical_key: first_name

  - name: last_name
    label: Last Name
    field_type: text
    required: true
    is_sensitive: false
    expected_canonical_key: last_name

  - name: email
    label: Email Address
    field_type: email
    required: false
    is_sensitive: false
    expected_canonical_key: email

  - name: household_size
    label: Household Size
    field_type: number
    required: true
    is_sensitive: false
    expected_canonical_key: household_size

  - name: num_children
    label: Number of children under 18
    field_type: number
    required: false
    is_sensitive: false
    expected_canonical_key: num_children

  - name: proof_docs
    label: Proof of address and income (optional)
    field_type: file
    required: false
    is_sensitive: false
    expected_canonical_key: null
    expected_file_constraints:
      accept: ".pdf,.jpg,.png"
      max_files: 2
      max_size_mb: 5

  - name: agree_share
    label: I agree Cedar Valley may share this application with its partner agencies.
    field_type: checkbox
    required: true
    is_sensitive: false
    expected_is_consent: true
    expected_canonical_key: null
